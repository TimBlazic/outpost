[package]
name = "outpost"
version = "0.1.0"
description = "Outpost studio CRM desktop shell"
authors = ["Tim Blažič"]
edition = "2021"

[lib]
name = "outpost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
